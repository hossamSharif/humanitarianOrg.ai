# Supabase local development config (`npx supabase start`).
# Schema lives in packages/database/migrations and is applied with
# `pnpm --filter @ngo/database migrate` (research R20), not supabase/migrations.
project_id = "ngo-procurement"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Captures invite and magic-link emails locally: http://127.0.0.1:54324
enabled = true
port = 54324

[storage]
enabled = true
# Matches the attachment limit (10 MB per file, research R11).
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/ar/accept-invite",
  "http://localhost:3000/en/accept-invite",
  "http://localhost:3000/ar/login",
  "http://localhost:3000/en/login",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Users join only by invitation (research R17).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

[auth.rate_limit]
email_sent = 30

[analytics]
enabled = false
